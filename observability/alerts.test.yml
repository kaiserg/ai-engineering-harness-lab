{
  "rule_files": [
    "alerts.yml"
  ],
  "evaluation_interval": "10s",
  "tests": [
    {
      "name": "outage pending firing resolved",
      "interval": "10s",
      "input_series": [
        {
          "series": "up{job=\"harness\",role=\"worker\",instance=\"worker:9100\"}",
          "values": "0 0 0 0 1 1"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "count(ALERTS{alertname=\"HarnessExporterUnavailable\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "count(ALERTS{alertname=\"HarnessExporterUnavailable\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "30s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "count(ALERTS{alertname=\"HarnessExporterUnavailable\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "40s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        }
      ]
    },
    {
