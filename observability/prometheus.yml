global:
  scrape_interval: 10s
  scrape_timeout: 6s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: harness
    static_configs:
      - targets: [api:9100]
        labels: {role: api}
      - targets: [worker:9100]
        labels: {role: worker}
      - targets: [identity:9100]
        labels: {role: identity}
      - targets: [jira-mcp:9100]
        labels: {role: jira}
